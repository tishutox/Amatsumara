<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Friendship Android App Download.">
  <title>Friendship | Android Download</title>
  <style>
    :root {
      --bg-top: #f6fbf8;
      --bg-bottom: #dcebe5;
      --ink: #0f2b25;
      --muted: #4e6962;
      --primary: #1e7a6c;
      --primary-press: #165d53;
      --card: #ffffff;
      --ring: rgba(30, 122, 108, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(12, 37, 33, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .cta {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border-radius: 12px;
      padding: 14px 18px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .cta:hover {
      background: var(--primary-press);
      transform: translateY(-1px);
    }

    .cta:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .meta {
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Friendship Android App</h1>
    <p>
      Das ist aktuell die Download-Seite. Die eigentliche Android App kannst du hier direkt als APK herunterladen.
    </p>

    <a class="cta" href="downloads/friendship-android-v1.apk" download>
      Android APK herunterladen
    </a>

    <p class="meta">Datei: friendship-android-v1.apk</p>
  </main>
</body>
</html>
